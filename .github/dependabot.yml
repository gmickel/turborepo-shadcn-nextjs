version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      workspace-patches:
        patterns: ['*']
        update-types: [patch]
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major, version-update:semver-minor]
    commit-message:
      prefix: chore
      include: scope
    labels: [dependencies]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: chore
      include: scope
    labels: [dependencies, github-actions]
